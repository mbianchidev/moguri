name: CI
on:
  push:
    # Every branch except release/**: scripts/release.sh validates those locally and main CI gates the tag. Tags never trigger CI.
    branches: ["**", "!release/**"]
permissions:
  contents: read
  packages: read
# Main keeps one group per commit, so a later push cannot cancel the run that gates a release (docs/releasing.md).
# Other branches share one group per ref, so a new push cancels the superseded run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Shared macOS runners run the suites three to four times slower than a developer Mac, so harness deadlines
      # (waitFor, per-test, polling and Playwright waits, never product latency budgets) stretch 4x. See docs/development.md.
      MOGURI_TEST_TIME_SCALE: "4"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          # @moguri-dev/sdk is public on GitHub Packages, which still needs a token; the workflow token can read public packages.
          registry-url: https://npm.pkg.github.com
          scope: "@moguri-dev"
      - run: npm ci --no-fund --no-progress
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run build
      - if: runner.os == 'macOS'
        run: npm exec -- playwright install chromium
      - run: npm test
        env:
          NODE_OPTIONS: --test-reporter=tap
      - if: runner.os == 'macOS'
        run: npm run test:e2e
        env:
          MOGURI_TEST_WINDOW: hidden
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: generated-test-evidence-${{ matrix.os }}
          path: |
            test-results/
            .moguri/artifacts/
          if-no-files-found: ignore
