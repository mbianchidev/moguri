[package]
name = "sdk-study-native"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
sdk-study-core.workspace = true
serde_json.workspace = true
napi = { version = "=3.15.0", default-features = false, features = ["napi9", "serde-json"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
